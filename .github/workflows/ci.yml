name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # gofmt + go vet + staticcheck + go test（ローカルの make check と同一）
      # RAPID_SEED は PBT（pgregory.net/rapid）の PRNG シード。実行ごとに変わるが
      # run_id としてログに残るため、失敗時に同じシードで再現できる（PBT-08）。
      - name: make check
        env:
          RAPID_SEED: ${{ github.run_id }}
        run: |
          echo "RAPID_SEED=$RAPID_SEED (再現: go test -rapid.seed=$RAPID_SEED ./...)"
          make check
